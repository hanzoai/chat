<!DOCTYPE html>
<html lang="en-US">

    <meta charset="utf-8" />
    <base href="/" />
    <title>Nav pilot harness</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;

    </style>

  </head>

    <div id="root"></div>
    <script type="module" src="/src/harness.tsx"></script>

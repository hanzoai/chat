<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Placeholders. One image serves hanzo.chat, lux.chat and zoolabs.io, so
         this document cannot know whose it is; `wear()` in src/brand.ts writes
         the name and the mark from the host before the first render. Naming one
         brand here is how the other two wore it until the bundle arrived. -->
    <title>Chat</title>
    <style>
      /* The two things only the host document can answer: how tall the app is,
         and that its one child is a flex item. @hanzo/ui's stylesheet resets and
         paints everything else, and `Screen` fills its parent by growing — which
         a block parent never asks it to do, so the whole app renders 0px tall.
         `dvh` rather than `vh` so a phone's collapsing browser chrome cannot
         crop the composer off the bottom of the conversation. */
      #root {
        display: flex;
        height: 100dvh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
